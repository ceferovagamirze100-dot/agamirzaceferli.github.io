
<section id="elektron-kitab" class="poet-book">
  <h2 class="book-heading">Ağamirzə Cəfərlinin şeir dünyası</h2>

  <div class="book" id="poetBook">
    <!-- KİTABIN ÜZ QABIĞI -->
    <div class="cover" id="poetCover">
      <div class="cover-frame">
        <div class="sun"></div>
        <div class="hill hill-one"></div>
        <div class="hill hill-two"></div>
        <div class="forest">🌲　🌳　🌲　🌳　🌲</div>
        <div class="flowers">🌼 🌷 🌿 🌹 🌼 🌸</div>

        <!-- Şairin stilizə olunmuş təsviri -->

          <div class="head"></div>
          <div class="hair"></div>
          <div class="body"></div>
          <div class="arm"></div>

          <div class="book-desk"></div>

        <div class="cover-words">

          <h3>Ağamirzə Cəfərli</h3>
          <p>Təbiətin qoynunda doğulan misralar</p>
          <button id="openPoetBook" class="book-btn">
            Kitabı aç 📖
          </button>
        </div>

        <div class="leaf-corner">🍂 🌿 🌹</div>
      </div>
    </div>

    <!-- KİTABIN İÇİ -->
    <div class="open-pages" id="openPages" hidden>
      <article class="sheet">
        <div class="flower-border">🌿 ❀ 🍂 ❀ 🌿</div>

        <span id="numLeft" class="page-num"></span>
      </article>
      <article class="sheet">

        <span id="numRight" class="page-num"></span>
      </article>
    </div>
  </div>

  <div class="book-nav">
    <button id="previousSpread" class="book-btn" disabled>
      ◀ Əvvəlki səhifə
    </button>
    <span id="bookPageStatus">Kitabın üz qabığı</span>
    <button id="nextSpread" class="book-btn" disabled>
      Sonrakı səhifə ▶
    </button>
  </div>
</section>

<script>
(() => {
  /*
    ŞEİRLƏRİN YAZILIŞI:
    Hər misranı yeni sətirdə yaz.
    Bəndlər arasında bir boş sətir saxla.
    Nümunə mətnləri öz şeirlərinlə əvəz et.
  */
  const poems = [
    {
      title: "Birinci şeir",
      text: `Buraya birinci misranı yaz
Buraya ikinci misranı yaz
Buraya üçüncü misranı yaz

İkinci bəndin birinci misrası
İkinci bəndin ikinci misrası`
    },
    {
      title: "İkinci şeir",
      text: `Buraya şeirinin birinci misrasını yaz
Buraya ikinci misrasını yaz

Burada növbəti bənd başlayır
Misralar yenə alt-alta yazılır`
    }
  ];

  const cover = document.getElementById("poetCover");
  const pages = document.getElementById("openPages");
  const left = document.getElementById("poemLeft");
  const right = document.getElementById("poemRight");
  const leftNum = document.getElementById("numLeft");
  const rightNum = document.getElementById("numRight");
  const status = document.getElementById("bookPageStatus");
  const openBtn = document.getElementById("openPoetBook");
  const prevBtn = document.getElementById("previousSpread");
  const nextBtn = document.getElementById("nextSpread");

  const pageContents = [];
  poems.forEach(poem => {
    const lines = poem.text.split("\n");
    const midpoint = Math.ceil(lines.length / 2);
    pageContents.push({
      title: poem.title,
      text: lines.slice(0, midpoint).join("\n")
    });
    pageContents.push({
      title: "",
      text: lines.slice(midpoint).join("\n")
    });
  });

  let spread = 0;

  function fillPage(element, item) {
    element.replaceChildren();
    if (!item) return;

    if (item.title) {
      const heading = document.createElement("h4");
      heading.textContent = item.title;
      element.appendChild(heading);
    }

    const text = document.createElement("div");
    text.textContent = item.text;
    element.appendChild(text);
  }

  function renderPages() {
    const first = spread * 2;
    const a = pageContents[first];
    const b = pageContents[first + 1];

    fillPage(left, a);
    fillPage(right, b);

    leftNum.textContent = a ? String(first + 1) : "";
    rightNum.textContent = b ? String(first + 2) : "";

    const end = Math.min(first + 2, pageContents.length);
    status.textContent =
      `Səhifələr ${first + 1}–${end} / ${pageContents.length}`;

    prevBtn.disabled = spread === 0;
    nextBtn.disabled = first + 2 >= pageContents.length;
  }

  openBtn.addEventListener("click", () => {
    cover.hidden = true;
    pages.hidden = false;
    spread = 0;
    renderPages();
  });

  prevBtn.addEventListener("click", () => {
    if (spread > 0) {
      spread--;
      renderPages();
    }
  });

  nextBtn.addEventListener("click", () => {
    if ((spread + 1) * 2 < pageContents.length) {
      spread++;
      renderPages();
    }
  });
})();
</script>
